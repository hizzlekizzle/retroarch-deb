[DEFAULT]
cleaner = fakeroot debian/rules clean
compression = xz
debian-branch = debian
pristine-tar = True
sign-tags = True
upstream-branch = master

[buildpackage]
export-dir = ../build-area/
tarball-dir = ../tarballs/

[import-dsc]
filter = [
  '.gitignore'
]

[import-orig]
dch = False
filter = [
  'debian/*',
  '*/debian/*'
]
filter-pristine-tar = True
upstream-vcs-tag = v%(version)s

[pq]
patch-numbers = True
patch-num-format = %04d-
renumber = True
